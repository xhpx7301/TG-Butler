name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in deploy/*.sh deploy/bu; do bash -n "$script"; done
      - run: shellcheck deploy/*.sh deploy/bu
      - run: sudo visudo -cf deploy/web-sudoers
      - run: bash deploy/install.sh --help
      - run: bash deploy/update.sh --help && bash deploy/bu --help
      - run: bash deploy/uninstall.sh --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/tg_butler/static/app.js

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
