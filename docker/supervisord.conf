[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=tgbutler:tgbutler

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:tg-butler-web]
command=/opt/venv/bin/tg-butler-web --config /var/lib/tg-butler/config.yaml
directory=/var/lib/tg-butler
user=tgbutler
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:tg-butler-monitor]
command=/opt/venv/bin/tg-butler --config /var/lib/tg-butler/config.yaml run
directory=/var/lib/tg-butler
user=tgbutler
autostart=%(ENV_TG_BUTLER_MONITOR_AUTOSTART)s
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
